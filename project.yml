name: GreaseLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  GreaseLog:
    type: application
    platform: iOS
    sources:
      - path: GreaseLog
      - path: Shared
    dependencies:
      - target: GreaseLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.grease-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: GreaseLog/GreaseLog.entitlements
    info:
      path: GreaseLog/Info.plist
      properties:
        CFBundleDisplayName: Grease Trap Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo to attach to a record.
        NSPhotoLibraryUsageDescription: Choose a photo to attach to a record.
        ITSAppUsesNonExemptEncryption: false
  GreaseLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GreaseLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.grease-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: GreaseLogWidget/GreaseLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: GreaseLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Grease Trap Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GreaseLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GreaseLogTests
    dependencies:
      - target: GreaseLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.grease-log.tests
        GENERATE_INFOPLIST_FILE: YES
  GreaseLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GreaseLogUITests
    dependencies:
      - target: GreaseLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.grease-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GreaseLog
schemes:
  GreaseLog:
    build:
      targets:
        GreaseLog: all
        GreaseLogTests: [test]
        GreaseLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: GreaseLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: GreaseLog/StoreKit/Products.storekit
      targets:
        - GreaseLogTests
        - GreaseLogUITests
    archive:
      config: Release
